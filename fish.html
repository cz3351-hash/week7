<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fish Swimming</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
</head>
<body>
  <script>
    let fishes = [];
    let bubbles = [];

    function setup() {
      createCanvas(windowWidth, windowHeight);
      colorMode(HSB, 360, 100, 100, 100);
      for (let i = 0; i < 12; i++) fishes.push(new Fish(true));
    }

    function draw() {
      drawWater();
      drawSand();
      drawSeaweed();

      for (const f of fishes) {
        f.update();
        f.show();
        // occasional bubble from a fish's mouth
        if (random() < 0.004) {
          bubbles.push(new Bubble(f.x + 34 * f.s, f.y - 6 * f.s, 3 + random(4)));
        }
      }

      drawLight();

      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.update();
        b.show();
        if (b.y < -20) bubbles.splice(i, 1);
      }
      // ambient bubbles rising from the bottom
      if (random() < 0.06) bubbles.push(new Bubble(random(width), height + 10, 3 + random(7)));
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }

    // ---------- scenery ----------

    function drawWater() {
      const ctx = drawingContext;
      const g = ctx.createLinearGradient(0, 0, 0, height);
      g.addColorStop(0, '#8fd3f4');
      g.addColorStop(1, '#0b3c5d');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, width, height);
    }

    function drawSand() {
      noStroke();
      fill(35, 45, 80);
      rect(0, height - 28, width, 28);
    }

    function drawSeaweed() {
      noFill();
      stroke(120, 60, 45, 90);
      strokeWeight(8);
      strokeJoin(ROUND);
      for (let i = 0; i < 6; i++) {
        const bx = ((i + 0.5) / 6) * width + noise(i * 7.7) * 80 - 40;
        const hgt = 90 + noise(i * 12.3) * 150;
        const sway = sin(frameCount * 0.02 + i * 1.7) * 22;
        bezier(bx, height, bx + sway * 0.3, height - hgt * 0.5,
               bx + sway * 0.8, height - hgt * 0.8, bx + sway, height - hgt);
      }
    }

    function drawLight() {
      noStroke();
      fill(0, 0, 100, 6);
      for (let i = 0; i < 4; i++) {
        const x = ((i + 0.5) / 4) * width + sin(frameCount * 0.005 + i * 2) * 40;
        quad(x - 60, -10, x + 60, -10, x + 160, height * 0.7, x - 40, height * 0.7);
      }
    }

    // ---------- fish ----------

    class Fish {
      constructor(startMid) {
        this.s = random(0.5, 1.5);                            // scale
        this.speed = random(1.5, 3) * (1.8 - this.s * 0.6);   // small fish dart faster
        this.y = random(height * 0.08, height * 0.85);
        this.x = startMid ? random(width) : -100 * this.s;
        this.hue = random(360);
        this.seed = random(1000);
      }

      update() {
        this.x += this.speed;
        if (this.x > width + 100 * this.s) {
          this.x = -100 * this.s;                             // wrap back to the left
          this.y = random(height * 0.08, height * 0.85);
          this.hue = random(360);
        }
      }

      show() {
        const bob = sin(frameCount * 0.03 + this.seed) * 8;   // gentle up/down drift
        const wag = sin(frameCount * 0.25 + this.seed) * 0.35;

        push();
        translate(this.x, this.y + bob);
        scale(this.s);

        const body = color(this.hue, 70, 90);
        const dark = color(this.hue, 80, 60);

        // tail (hinged at the rear, wagging)
        push();
        translate(-34, 0);
        rotate(wag);
        fill(dark);
        triangle(0, -18, 0, 18, -26, 0);
        pop();

        // body
        fill(body);
        noStroke();
        ellipse(0, 0, 72, 34);

        // stripe
        fill(this.hue, 70, 55, 60);
        ellipse(-14, 0, 8, 28);

        // dorsal fin
        fill(dark);
        triangle(-8, -16, 16, -14, 4, -28);

        // pectoral fin
        push();
        translate(-4, 6);
        rotate(0.6 + wag * 0.5);
        triangle(0, 0, 14, 2, 4, 12);
        pop();

        // eye
        fill(0, 0, 100);
        ellipse(22, -6, 10);
        fill(0, 0, 0);
        ellipse(24, -6, 5);

        pop();
      }
    }

    // ---------- bubbles ----------

    class Bubble {
      constructor(x, y, r) {
        this.x = x;
        this.y = y;
        this.r = r;
        this.seed = random(1000);
        this.speed = random(0.6, 1.6);
      }

      update() {
        this.y -= this.speed;
        this.x += sin(frameCount * 0.05 + this.seed) * 0.3;
      }

      show() {
        noFill();
        stroke(0, 0, 100, 50);
        strokeWeight(1.5);
        circle(this.x, this.y, this.r * 2);
      }
    }
  </script>
</body>
</html>
